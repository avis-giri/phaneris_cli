[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phaneris-cli"
version = "0.4.1"
description = "Use Phaneris from a terminal: your disclosures, reports, scoring and questions, with your account's access."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { text = "Proprietary" }

[project.optional-dependencies]
# full-screen mode (phaneris tui); the plain command line needs nothing else
tui = ["textual>=8.0"]

[project.scripts]
phaneris = "phaneris_cli.main:main"

[tool.setuptools]
packages = ["phaneris_cli"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
